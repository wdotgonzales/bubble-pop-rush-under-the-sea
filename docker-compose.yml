services:
  db:
    image: postgres:16-alpine
    container_name: game_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-gamedb}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - game-net

  backend:
    build: ./backend
    container_name: game_backend
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgrespassword}
      - POSTGRES_DB=${POSTGRES_DB:-gamedb}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${SECRET_KEY}
      - FB_APP_SECRET=${FB_APP_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      - db
    networks:
      - game-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Read from the .env next to this file; the build stops with a message if it is missing.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: game_frontend
    restart: always
    networks:
      - game-net

  nginx:
    image: nginx:alpine
    container_name: game_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - game-net

volumes:
  postgres_data:

networks:
  game-net:
    driver: bridge