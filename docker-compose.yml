version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: game_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-gamedb}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - game-net

  backend:
    build: ./backend
    container_name: game_backend
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgrespassword}
      - POSTGRES_DB=${POSTGRES_DB:-gamedb}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db
    networks:
      - game-net

  frontend:
    build: ./frontend
    container_name: game_frontend
    restart: always
    networks:
      - game-net

  nginx:
    image: nginx:alpine
    container_name: game_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - game-net

volumes:
  postgres_data:

networks:
  game-net:
    driver: bridge