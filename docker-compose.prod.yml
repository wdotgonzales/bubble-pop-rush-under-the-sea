services:
  db:
    image: postgres:16-alpine
    container_name: bubble_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: ghcr.io/${GHCR_USERNAME}/bubble-pop-backend:latest
    container_name: bubble_backend_prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
    restart: always

  frontend:
    image: ghcr.io/${GHCR_USERNAME}/bubble-pop-frontend:latest
    container_name: bubble_frontend_prod
    restart: always

  nginx:
    image: ghcr.io/${GHCR_USERNAME}/bubble-pop-nginx:latest
    container_name: bubble_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  postgres_data: