services:
  db:
    image: postgres:16-alpine
    container_name: bubble_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    image: ghcr.io/wdotgonzales/bubble-pop-backend:latest
    container_name: bubble_backend_prod
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is not set}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is not set}
      - FB_APP_SECRET=${FB_APP_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS is not set}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  frontend:
    image: ghcr.io/wdotgonzales/bubble-pop-frontend:latest
    container_name: bubble_frontend_prod
    restart: always

  nginx:
    image: ghcr.io/wdotgonzales/bubble-pop-nginx:latest
    container_name: bubble_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  postgres_data: